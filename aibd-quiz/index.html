const QB = [
/* ----- Ch01 ----- */
{ch:1,type:'single',q:'下列哪一項不是促成 2021 年以後 AI × 生醫爆發的關鍵？',o:['UK Biobank / HCA 大規模資料','Transformer 架構與 GPU','放寬醫療資料隱私法規','開源權重 (ESM、scGPT)'],ans:2,exp:'GDPR / HIPAA / EU AI Act 反而更嚴格。'},
{ch:1,type:'single',q:'AlphaFold 3 相對於 AF2 最關鍵的新能力？',o:['縮小參數量','聯合預測蛋白-核酸-配體-離子','完全開放商用','取代質譜'],ans:1,exp:'Nature 630:493–500 (2024) diffusion decoder。'},
{ch:1,type:'single',q:'Foundation Model 與傳統監督式 DL 最大差別？',o:['不需要 GPU','只用小資料','大規模自監督預訓練 + 微調','必須用 RL'],ans:2,exp:'scGPT / ESM-3 / UNI 共通範式。'},
{ch:1,type:'tf',q:'2024 起，幾乎每個生醫子領域都已有自己的 Foundation Model。',o:['對','錯'],ans:0,exp:'基因體、單細胞、病理、影像、臨床、蛋白均有 FM。'},
{ch:1,type:'single',q:'AlphaFold 2 在哪一年發表？',o:['2017','2019','2021','2023'],ans:2,exp:'Nature 596 (2021)。'},
{ch:1,type:'multi',q:'下列哪些屬於 2024 年的代表性 AI × 生醫進展？(複選)',o:['AlphaFold 3','scGPT','AlphaMissense Nature 封面','Med-Gemini 91.1% MedQA','BLAST 演算法'],ans:[0,1,3],exp:'AlphaMissense 為 2023 Science，BLAST 為 1990 年代。'},
{ch:1,type:'single',q:'ImageNet 時刻指的是？',o:['免費的醫學影像比賽','深度學習在電腦視覺超越傳統','一個資料集名稱','AI 比賽冠軍'],ans:1,exp:'AlexNet 2012 帶動視覺 DL 浪潮。'},
{ch:1,type:'single',q:'下列哪一項是 2025 年 CZI 推出的代表性產品？',o:['rBio (virtual cell reasoning)','GPT-5','LLaMA-4','PaLM-3'],ans:0,exp:'CZI rBio 為 2025 重要里程碑。'},
{ch:1,type:'tf',q:'Borzoi 的脈絡長度大於 Enformer。',o:['對','錯'],ans:0,exp:'Borzoi ~524 kb > Enformer ~200 kb。'},
{ch:1,type:'single',q:'本教程共有幾章？',o:['10','15','20','25'],ans:2,exp:'20 章 / 5 區塊。'},

/* ----- Ch02 ----- */
{ch:2,type:'single',q:'OMOP CDM 與 FHIR 的差別？',o:['OMOP=分析導向；FHIR=交換導向','OMOP 只用於癌症','FHIR 是基因體格式','兩者等價'],ans:0,exp:'OHDSI 大規模研究用 OMOP；HL7 FHIR 即時交換。'},
{ch:2,type:'single',q:'適合跨族裔藥物反應研究的資料？',o:['TCGA','UK Biobank','All of Us','ENCODE'],ans:2,exp:'All of Us 強調多元族裔代表性。'},
{ch:2,type:'single',q:'HIPAA Safe Harbor 規定刪除幾種識別子？',o:['5','10','18','33'],ans:2,exp:'18 項識別子。'},
{ch:2,type:'multi',q:'下列哪些是空間轉錄組技術？(複選)',o:['10x Visium','Xenium','MERFISH','BLAST'],ans:[0,1,2],exp:'BLAST 是序列比對工具。'},
{ch:2,type:'single',q:'TCGA 有多少種癌症？',o:['12','22','33','55'],ans:2,exp:'33 cancer types。'},
{ch:2,type:'single',q:'GTEx v9 涵蓋幾個健康組織？',o:['12','24','54','108'],ans:2,exp:'54 tissues。'},
{ch:2,type:'tf',q:'UK Biobank 受試者多數為歐裔。',o:['對','錯'],ans:0,exp:'約 94% 歐裔。'},
{ch:2,type:'single',q:'HCA 已標註多少細胞數量級？',o:['5 千','5 萬','5 百萬','5 千萬'],ans:3,exp:'>50M 細胞。'},
{ch:2,type:'multi',q:'下列哪些是公開 EHR / 影像資料集？(複選)',o:['MIMIC-IV','CheXpert','NIH ChestX-ray14','UniProt'],ans:[0,1,2],exp:'UniProt 為蛋白序列庫。'},
{ch:2,type:'single',q:'下列哪一個是 AlphaFold DB 規模？',o:['200 萬','2000 萬','2 億','20 億'],ans:2,exp:'200M+ 預測結構。'},

/* ----- Ch03 ----- */
{ch:3,type:'single',q:'ESM-2 採用何種自監督？',o:['Masked amino acid prediction','Contrastive learning','RL','GAN'],ans:0,exp:'BERT-like 遮蔽預測。'},
{ch:3,type:'single',q:'罕病 1:1000 不平衡時最不建議的指標？',o:['AUPRC','F1','Accuracy','Decision curve'],ans:2,exp:'總是預測陰性也有 99.9% accuracy。'},
{ch:3,type:'single',q:'資料若按樣本切分而不按個案，可能造成？',o:['記憶體爆炸','過樂觀的測試表現','違反 GDPR','永遠 underfit'],ans:1,exp:'同一個案資訊跨進測試集 = data leakage。'},
{ch:3,type:'tf',q:'U-Net 適合醫療影像分割。',o:['對','錯'],ans:0,exp:'醫療影像金標準骨幹。'},
{ch:3,type:'single',q:'Mamba 屬於哪一類架構？',o:['CNN','RNN','State Space Model','Tree'],ans:2,exp:'2024 起的 SSM 新世代序列模型。'},
{ch:3,type:'single',q:'Diffusion model 的關鍵思想？',o:['一次性生成','從雜訊逐步還原樣本','PCA','直接回歸'],ans:1,exp:'denoising 過程。'},
{ch:3,type:'multi',q:'下列哪些是常用正則化技巧？(複選)',o:['Dropout','Weight decay','Mixup','Higher learning rate'],ans:[0,1,2],exp:'高 LR 不是正則化。'},
{ch:3,type:'single',q:'Loss + Optimizer + Architecture 是 ML 三件套，下列哪個不在內？',o:['CrossEntropy','AdamW','ResNet','SQL'],ans:3,exp:'SQL 為資料查詢語言。'},
{ch:3,type:'tf',q:'GNN 適合分子（atom+bond）建模。',o:['對','錯'],ans:0,exp:'D-MPNN / GIN 常見。'},
{ch:3,type:'single',q:'EHR 時序預測常用的 Transformer 變體？',o:['ViT','TFT','BERT','DALL-E'],ans:1,exp:'Temporal Fusion Transformer。'},

/* ----- Ch04 ----- */
{ch:4,type:'single',q:'EU AI Act 把醫療 AI 列為？',o:['Minimal','Limited','High','Unacceptable'],ans:2,exp:'MDR/IVDR 範圍內自動 high-risk。'},
{ch:4,type:'single',q:'FDA PCCP 的核心承諾？',o:['免做臨床試驗','在預核准協定下迭代更新','完全 open source','免責'],ans:1,exp:'PCCP = description + protocol + impact assessment。'},
{ch:4,type:'single',q:'Obermeyer 2019 核心教訓？',o:['模型參數太少','用支出作為健康需求的代理會放大歧視','黑人較健康','AI 不該用於醫療'],ans:1,exp:'代理變數本身可以是偏差。'},
{ch:4,type:'tf',q:'EU AI Act 2024/1689 高風險條款 2026-08 全面適用。',o:['對','錯'],ans:0,exp:'醫材延至 2027-08。'},
{ch:4,type:'multi',q:'下列哪些屬於公平性指標？(複選)',o:['Demographic Parity','Equal Opportunity','Equalized Odds','Adam Optimizer'],ans:[0,1,2],exp:'Adam 是優化器。'},
{ch:4,type:'single',q:'Chouldechova 2017 不可能性定理指出？',o:['校準/均等機率/預測值同等 三者不能同時成立（除非基期相同）','所有 AI 都不公平','永遠選 Equal Opportunity','GDPR 衝突'],ans:0,exp:'三大公平性指標衝突。'},
{ch:4,type:'tf',q:'TRIPOD-AI 2024 要求子族 AUC 報告。',o:['對','錯'],ans:0,exp:'BMJ 2024 公布。'},
{ch:4,type:'single',q:'PCCP 三件套不包括下列哪一項？',o:['Description of modifications','Modification protocol','Impact assessment','Marketing budget'],ans:3,exp:'PCCP 為技術文件。'},
{ch:4,type:'single',q:'代理變數的最大風險？',o:['加 GPU','學到結構性偏差而非真實需求','增加 epoch','降低 AUC'],ans:1,exp:'Obermeyer 案例。'},
{ch:4,type:'multi',q:'下列哪些是上市前自查項目？(複選)',o:['TRIPOD-AI','CONSORT-AI','SPIRIT-AI','HTML5 規範'],ans:[0,1,2],exp:'HTML5 與醫療無關。'},

/* ----- Ch05 ----- */
{ch:5,type:'single',q:'Caduceus 核心架構特色？',o:['Vanilla Transformer','Mamba SSM + RC-equivariant','CNN+PWM','RNN+Attention'],ans:1,exp:'SSM + 反向互補等變。'},
{ch:5,type:'single',q:'In-silico mutagenesis 是？',o:['細胞編輯實驗','用模型對 ref vs alt 推論求差異','PCR primer','CRISPR screen'],ans:1,exp:'序列 AI 經典解釋法。'},
{ch:5,type:'single',q:'2024 序列 AI benchmark 共識？',o:['Caduceus 全勝','沒有單一模型在所有任務勝出','只看 AUROC','CADD 落後最多'],ans:1,exp:'任務本質決定 inductive bias。'},
{ch:5,type:'single',q:'Enformer 的脈絡長度約？',o:['1 kb','20 kb','200 kb','2 Mb'],ans:2,exp:'~200 kb。'},
{ch:5,type:'tf',q:'Borzoi 是 Enformer 的衍生模型。',o:['對','錯'],ans:0,exp:'同團隊改良。'},
{ch:5,type:'single',q:'Nucleotide Transformer v2 的訓練模型最大為多少參數？',o:['100M','500M','2.5B','100B'],ans:2,exp:'NT-v2 2.5B 多物種。'},
{ch:5,type:'multi',q:'下列哪些屬於 DNA Foundation Models？(複選)',o:['Enformer','Borzoi','Caduceus','AlphaFold 3'],ans:[0,1,2],exp:'AF3 是蛋白模型。'},
{ch:5,type:'single',q:'GPN-MSA 屬於哪一類方法？',o:['Alignment-based','Functional supervision','Diffusion','RLHF'],ans:0,exp:'保守度為基底。'},
{ch:5,type:'single',q:'Caduceus 在多長序列上超過 Enformer？',o:['超過 1 kb','超過 100 kb（從 TSS）','超過 1 Mb','從不'],ans:1,exp:'長尾距離 Caduceus 勝。'},
{ch:5,type:'tf',q:'BPE tokenization 通常增加模型參數量。',o:['對','錯'],ans:1,exp:'BPE 降冗餘 token，反而減量。'},

/* ----- Ch06 ----- */
{ch:6,type:'single',q:'scFM 為什麼在新組織零樣本可能失準？',o:['訓練太多','OOD 細胞型態','UMAP 慢','沒 CUDA'],ans:1,exp:'分布外推 (OOD)。'},

{ch:6,type:'single',q:'8 GB GPU 想做 scFM 最推薦？',o:['UCE','scFoundation','scGPT','CellFM'],ans:2,exp:'scGPT 推論最輕。'},
{ch:6,type:'multi',q:'下列哪些是 2024-2025 主流 scFM？(複選)',o:['scGPT','Geneformer','scFoundation','UCE','CellFM','BLAST'],ans:[0,1,2,3,4],exp:'BLAST 為傳統工具。'},
{ch:6,type:'tf',q:'scGPT 預訓於 33M 細胞。',o:['對','錯'],ans:0,exp:'Nature Methods 2024。'},
{ch:6,type:'single',q:'2025 benchmark 中 scGPT/Geneformer/CellFM 入圍前三的依據？',o:['只看跑分','使用性 × 效能綜合','只看記憶體','只看訓練時間'],ans:1,exp:'usability × performance。'},
{ch:6,type:'single',q:'scFM 可做下列哪一項？',o:['零樣本細胞註釋','批次整合','藥物敏感性預測','以上皆是'],ans:3,exp:'all of the above。'},
{ch:6,type:'tf',q:'CellFM 是多模態（含 ATAC）FM。',o:['對','錯'],ans:0,exp:'2025 100M cells。'},
{ch:6,type:'single',q:'2025 benchmark 提示在何種情境 scVI 仍有競爭力？',o:['超大資料','小資料 / 高解析度狀態','需 zero-shot','不需 GPU'],ans:1,exp:'scFM 並非永遠勝。'},
{ch:6,type:'single',q:'scGPT 架構類型？',o:['CNN','GPT-style decoder','GAN','RL'],ans:1,exp:'GPT-style。'},

/* ----- Ch07 ----- */
{ch:7,type:'single',q:'MOFA+ 最大優勢？',o:['最快','可解釋因子並可關聯臨床','免微調','不需安裝'],ans:1,exp:'稀疏因子。'},
{ch:7,type:'single',q:'SpatialGlue 核心技術？',o:['PCA','GNN + dual attention（空間 × 模態）','RF','UMAP'],ans:1,exp:'Nat Methods 2024。'},
{ch:7,type:'single',q:'CITE-seq 整合 2024 benchmark 之冠？',o:['Harmony','totalVI','PCA','ComBat'],ans:1,exp:'totalVI 為 CITE-seq 量身打造。'},
{ch:7,type:'multi',q:'下列哪些是多體學整合方法？(複選)',o:['MOFA+','totalVI','MultiVI','SpatialGlue','BLAST'],ans:[0,1,2,3],exp:'BLAST 為序列比對。'},
{ch:7,type:'tf',q:'SpatialData 是 scverse 提出的空間 multi-omics 容器。',o:['對','錯'],ans:0,exp:'2024 推出。'},
{ch:7,type:'single',q:'10x Visium 屬於空間轉錄組第幾代？',o:['1','2','3','4'],ans:0,exp:'第一代 spot 等級。'},
{ch:7,type:'single',q:'MERFISH / Xenium 屬於？',o:['第一代 bulk','第二代 sub-cellular','第三代單分子','非空間'],ans:2,exp:'單分子原位。'},
{ch:7,type:'single',q:'MultiVI 主要優勢？',o:['可處理缺模態樣本','加速 PCR','取代 Harmony','取代 scGPT'],ans:0,exp:'缺模態仍能整合。'},
{ch:7,type:'multi',q:'下列哪些屬於 scverse 生態？(複選)',o:['scvi-tools','Squidpy','SpatialData','AlphaFold','SnpEff'],ans:[0,1,2],exp:'AF / SnpEff 為其他生態。'},
{ch:7,type:'tf',q:'MEFISTO 是 MOFA+ 在時空資料的延伸。',o:['對','錯'],ans:0,exp:'功能性整合。'},

/* ----- Ch08 ----- */
{ch:8,type:'single',q:'ACMG 中 AI 變異預測通常對應到？',o:['PVS1','PS3','PP3/BP4','BA1'],ans:2,exp:'計算證據強度。'},

{ch:8,type:'single',q:'SVI 2023 給出何種建議？',o:['AI 分數量化強度對應 PP3/BP4','禁用 AI','所有變異視為 VUS','只用 CADD'],ans:0,exp:'量化 thresholds。'},

// ===== UI logic =====
let mode='intro', list=[], wrong=JSON.parse(localStorage.getItem('aibd_wrong')||'[]');
const $=(s,p=document)=>p.querySelector(s);
function setMode(m){mode=m;$('#curMode').textContent=
  ({intro:'—',full:'完整模擬 200 題',rand:'隨機 20 題',chap:'章節練習',wrong:'錯題複習'})[m];}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function renderModes(){
  const opts=[['intro','請選模式'],['full','完整模擬考 (200)'],['rand','隨機 20 題'],['chap','章節練習'],['wrong','錯題複習']];
  $('#modeRow').innerHTML=opts.map(([k,l])=>`<button class="toggle-btn ${mode===k?'active':''}" onclick="onMode('${k}')">${l}</button>`).join('');
}
function renderChaps(){
  let html='';
  for(let i=1;i<=20;i++) html+=`<button class="toggle-btn toggle-btn-sm" onclick="loadChap(${i})">Ch${String(i).padStart(2,'0')}</button>`;
  $('#chapRow').innerHTML=html;
}
function onMode(m){
  setMode(m); renderModes();
  $('#chapRow').style.display=(m==='chap')?'flex':'none';
  if(m==='full'){list=shuffle(QB); render();}
  else if(m==='rand'){list=shuffle(QB).slice(0,20); render();}
  else if(m==='wrong'){
    if(!wrong.length){$('#qList').innerHTML='<p style="color:var(--c-ink-muted)">尚無錯題紀錄</p>';$('#endBanner').innerHTML=''; updateMeta(); return;}
    list=wrong.map(idx=>QB[idx]); render();
  } else {$('#qList').innerHTML='';$('#endBanner').innerHTML='';updateMeta();}
}
function loadChap(c){list=QB.filter(q=>q.ch===c); render();}
function updateMeta(){
  const total=list.length;
  const correct=document.querySelectorAll('.qbox.correct').length;
  const wrongN=document.querySelectorAll('.qbox.wrong').length;
  $('#curTotal').textContent=total;$('#curCorrect').textContent=correct;$('#curWrong').textContent=wrongN;
}
function render(){
  $('#endBanner').innerHTML='';
  if(!list.length){$('#qList').innerHTML='<p style="color:var(--c-ink-muted)">本範圍尚無題目</p>';updateMeta();return;}
  $('#qList').innerHTML=list.map((q,i)=>{
    const typeName={single:'單選',multi:'複選',tf:'是非'}[q.type];
    return `<div class="qbox" id="qb${i}">
      <span class="qtag">Ch${String(q.ch).padStart(2,'0')}</span><span class="qtype">${typeName}</span>
      <h4>${i+1}. ${q.q}</h4>
      <div>${q.o.map((t,oi)=>`<div class="qopt" data-i="${oi}" onclick="pick(${i},${oi})">${t}</div>`).join('')}</div>
      <button class="q-submit" onclick="submit(${i})">送出</button>
      <div class="qexp" id="ex${i}"></div>
    </div>`;
  }).join('');
  list.forEach(q=>q._sel=null);
  updateMeta();
}
function pick(qi,oi){
  const q=list[qi]; const box=$('#qb'+qi);
  if(box.classList.contains('correct')||box.classList.contains('wrong'))return;
  if(q.type==='multi'){
    q._sel=q._sel||[];
    const idx=q._sel.indexOf(oi);
    if(idx>=0){q._sel.splice(idx,1);} else {q._sel.push(oi);}
    box.querySelectorAll('.qopt').forEach(el=>{
      el.classList.toggle('sel', q._sel.includes(+el.dataset.i));
    });
  } else {
    q._sel=oi;
    box.querySelectorAll('.qopt').forEach(el=>{
      el.classList.toggle('sel', +el.dataset.i===oi);
    });
  }
}
function submit(qi){
  const q=list[qi]; const box=$('#qb'+qi);
  if(box.classList.contains('correct')||box.classList.contains('wrong'))return;
  let ok=false;
  if(q.type==='multi'){
    const sel=(q._sel||[]).slice().sort();
    const ans=q.ans.slice().sort();
    ok = sel.length===ans.length && sel.every((v,i)=>v===ans[i]);
  } else {
    ok = q._sel===q.ans;
  }
  // mark options
  box.querySelectorAll('.qopt').forEach(el=>{
    const oi=+el.dataset.i;
    const isAns = Array.isArray(q.ans)? q.ans.includes(oi) : q.ans===oi;
    if(isAns) el.classList.add('ok');
    const selOk = Array.isArray(q._sel)? q._sel.includes(oi) : q._sel===oi;
    if(selOk && !isAns) el.classList.add('bad');
  });
  box.classList.add(ok?'correct':'wrong');
  const ex=$('#ex'+qi);
  ex.classList.add('show');
  ex.innerHTML='<b>'+(ok?'✓ 答對':'✗ 答錯')+'</b> · '+(q.exp||'');
  // track wrong
  const idx=QB.indexOf(q);
  if(!ok && !wrong.includes(idx)){wrong.push(idx);localStorage.setItem('aibd_wrong',JSON.stringify(wrong));}
  if(ok){const w=wrong.indexOf(idx);if(w>=0){wrong.splice(w,1);localStorage.setItem('aibd_wrong',JSON.stringify(wrong));}}
  updateMeta();
  // banner if all done
  if(document.querySelectorAll('.qbox').length === document.querySelectorAll('.qbox.correct, .qbox.wrong').length){
    const c=document.querySelectorAll('.qbox.correct').length;
    const t=list.length;
    $('#endBanner').innerHTML=`<div class="score-banner"><h3>得分 ${c} / ${t} (${Math.round(c/t*100)}%)</h3><p>${wrong.length} 題仍在錯題庫中，可用「錯題複習」回顧。</p></div>`;
  }
}
function resetWrong(){if(confirm('確定清空錯題庫？'))localStorage.setItem('aibd_wrong','[]'),wrong=[],alert('已清空');}
renderModes(); renderChaps(); setMode('intro');
</script>
